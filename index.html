<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar Counter System</title>
<meta name="theme-color" content="#12181a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a dim back-bar console; the open bill is the one bright object, a paper docket. */
:root{
  color-scheme:dark;
  --bg:#12181a;
  --panel:#1b2427;
  --panel-2:#243034;
  --line:#33444a;
  --ink:#ece6d8;
  --muted:#93a3a3;
  --brass:#e2a63b;
  --brass-ink:#1d1403;
  --paper:#f2ead8;
  --paper-ink:#25211a;
  --ok:#5fc28b;
  --warn:#f0a04b;
  --crit:#ef6a5b;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:26px;line-height:1;color:var(--brass)}
nav{display:flex;gap:4px;flex:1}
nav button{background:none;border:0;padding:8px 14px;border-radius:6px;font-weight:600;color:var(--muted)}
nav button[aria-current="true"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--brass)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.busy i{background:var(--warn)}
.sync.off i{background:var(--crit)}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:7px 12px}
.ghost:hover{border-color:var(--muted)}
.note{margin:0;padding:8px 16px;background:#3a2c12;color:#f6d9a0;font-size:13px}
main{flex:1;overflow:auto;padding:16px}
.empty{color:var(--muted);padding:28px 8px;text-align:center}

/* Orders */
.orders{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.chip small{color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.chip[aria-pressed="true"] small{color:var(--brass-ink)}
.chip.new{border-style:dashed;color:var(--brass)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cats button{background:none;border:0;border-bottom:2px solid transparent;padding:4px 8px;color:var(--muted);font-family:var(--display);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.cats button[aria-pressed="true"]{color:var(--ink);border-color:var(--brass)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:92px}
.item:hover{border-color:var(--brass)}
.item:active{transform:translateY(1px)}
.item b{font-weight:600;line-height:1.25}
.item .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:6px}
.item .price{font-family:var(--mono);color:var(--brass)}
.pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.crit{color:var(--crit)}

.docket{background:var(--paper);color:var(--paper-ink);font-family:var(--mono);font-size:13px;padding:18px 16px 22px;position:sticky;top:0;
  --z:linear-gradient(-45deg,var(--bg) 5px,transparent 0),linear-gradient(45deg,var(--bg) 5px,transparent 0)}
.docket::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--z);background-size:10px 10px;background-position:left bottom;background-repeat:repeat-x}
.docket h2{font-size:24px;text-align:center}
.docket .meta{text-align:center;color:#6d6555;margin:2px 0 10px}
.docket hr{border:0;border-top:1px dashed #a89d85;margin:10px 0}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:5px 0}
.line .q{display:flex;align-items:center;gap:6px;color:#6d6555}
.q button{width:26px;height:26px;border-radius:50%;border:1px solid #a89d85;background:none;color:var(--paper-ink);font-weight:700;line-height:1}
.tot{display:flex;justify-content:space-between;padding:2px 0}
.tot.big{font-family:var(--display);font-size:30px;font-weight:800;margin-top:6px}
.docket .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.primary{background:var(--brass);color:var(--brass-ink);border:0;border-radius:6px;padding:11px 14px;font-weight:700;font-family:var(--body);flex:1}
.primary:disabled{opacity:.45;cursor:not-allowed}
.docket .plain:disabled{opacity:.45}
.docket .plain{background:none;border:1px solid #a89d85;color:var(--paper-ink);border-radius:6px;padding:10px 12px;font-family:var(--body);font-weight:600}
.jump{display:none}

.addc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:18px}
.addc label{font-family:var(--display);font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--brass);flex-basis:100%}
.addc input{flex:1 1 200px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:16px;color:var(--ink)}
.addc .primary{flex:0 0 auto}
.custs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cust{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:8px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px}
.cust:hover{border-color:var(--brass)}
.cust b{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.cust .what{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cust .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:auto}
.cust small{color:var(--muted)}
.cust .price{font-family:var(--mono);color:var(--brass);font-size:16px}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tools input{flex:1 1 180px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 12px;color:var(--ink)}
.sub{font-size:16px;color:var(--muted);margin:0 0 8px}
.grid.quick{margin-bottom:18px}
.grid.quick .item{border-color:var(--brass);background:#2a2716}
.hhbar{margin:0 0 12px;padding:8px 12px;border-radius:6px;background:#3a2c12;color:#f6d9a0;font-weight:600}
.pill.hh{color:var(--brass)}
.mini{border:1px solid #a89d85;background:none;color:var(--paper-ink);border-radius:999px;padding:2px 9px;font:600 11px var(--body);margin-left:4px}
.hint{color:var(--muted);margin:0 0 10px;font-size:13px}
.selrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.selrow small{color:var(--muted)}
.selrow .q{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.selrow .q button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-weight:700}
.seltot{margin:10px 0 0;text-align:right}
.live{font-weight:600;min-height:1.4em;margin:8px 0 0}
.warnbox{background:#3a2c12;color:#f6d9a0;border-radius:6px;padding:8px 10px;margin:0 0 10px}
.closebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:8px;padding:10px 14px;margin-bottom:18px}
.f>.w,.f>.acts,.f>h3,.f>p{grid-column:1/-1}
.f select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:15px;color:var(--ink);width:100%}
.f label.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.f label.chk input,.days7 input{width:auto}
.days7{display:flex;flex-wrap:wrap;gap:6px 12px}
.days7 label{flex-direction:row;align-items:center;gap:5px;font-size:13px;color:var(--ink)}
.primary:disabled,.ghost:disabled{opacity:.45;cursor:not-allowed}

/* Stock + reports */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tile strong{display:block;font-family:var(--display);font-size:32px;line-height:1.1}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:880px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;background:var(--panel)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tr.crit td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
tr.warn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 12px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.card h3{font-size:18px;margin-bottom:10px}
.rank{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;margin-bottom:9px}
.rank i{grid-column:1/-1;height:6px;border-radius:3px;background:var(--brass);min-width:2px}
.days{display:flex;align-items:flex-end;gap:4px;height:150px;border-bottom:1px solid var(--line)}
.days div{flex:1;background:linear-gradient(var(--brass),#8a6522);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.days div.today{outline:1px solid var(--ink)}
.days div b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:500 10px var(--mono);color:var(--muted);padding-bottom:2px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.bills button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0;text-align:left}
.bills button:last-child{border:0}
.bills .void{text-decoration:line-through;color:var(--muted)}

/* Modal */
.veil{position:fixed;inset:0;background:rgba(5,9,10,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(440px,100%);max-height:100%;overflow:auto}
.dialog h2{font-size:24px;margin-bottom:12px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.f label.w{grid-column:1/-1}
.f input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:15px;color:var(--ink);width:100%}
.dialog .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.danger{background:none;border:1px solid var(--crit);color:var(--crit);border-radius:6px;padding:9px 12px;font-weight:600}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.methods button{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px 6px;font-weight:600}
.methods button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.due{font-family:var(--display);font-size:44px;font-weight:800;line-height:1;color:var(--brass)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.receipt{background:var(--paper);color:var(--paper-ink);font:13px/1.5 var(--mono);padding:14px;white-space:pre-wrap;border-radius:4px;overflow-x:auto}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;z-index:20;max-width:90%}

@media (max-width:860px){
  .orders{grid-template-columns:1fr}
  .docket{position:relative}
  .jump{display:flex;position:sticky;bottom:0;margin:14px -16px -16px;padding:10px 16px;background:var(--panel-2);border-top:1px solid var(--line);justify-content:space-between;align-items:center;gap:10px}
  .jump button{flex:0 0 auto}
  header h1{font-size:22px}
  nav{order:3;flex-basis:100%}
  nav button{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#printarea{display:none}
@media print{
  @page{margin:4mm}
  html,body{height:auto;background:#fff!important;color:#000!important;display:block}
  body>*:not(#printarea){display:none!important}
  #printarea{display:block;margin:0;font:12px/1.45 "DM Mono",ui-monospace,Menlo,Consolas,monospace;white-space:pre;color:#000}
}
</style>
</head>
<body>
<header>
  <h1 id="barname">My Bar</h1>
  <nav aria-label="Sections">
    <button data-a="nav" data-v="orders">Customers</button>
    <button data-a="nav" data-v="stock">Stock</button>
    <button data-a="nav" data-v="reports">Reports</button>
  </nav>
  <span class="sync" id="sync"><i></i><span>Connecting</span></span>
  <button class="ghost" data-a="settings">Setup</button>
</header>
<p class="note" id="note" hidden></p>
<main id="main"><p class="empty">Loading your bar…</p></main>
<div id="modal"></div>
<div id="toast" class="toast" hidden role="status"></div>
<pre id="printarea" aria-hidden="true"></pre>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, "0");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const rm = sen => "RM " + (sen / 100).toLocaleString("en-MY", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const toSen = v => Math.round((parseFloat(v) || 0) * 100);
const hhmm = t => new Date(t).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
const PAY = {cash: "Cash", card: "Card", ewallet: "E-wallet / QR"};

/*PURE*/
function totals(lines, set, method) {
  const sub = lines.reduce((a, l) => a + l.price * l.qty, 0);
  const svc = Math.round(sub * (set.svc || 0) / 100);
  const tax = Math.round((sub + svc) * (set.tax || 0) / 100);
  const raw = sub + svc + tax;
  const round = method === "cash" && set.round5 ? Math.round(raw / 5) * 5 - raw : 0;
  return {sub, svc, tax, round, total: raw + round};
}
function summarise(bills) {
  const r = {sales: 0, net: 0, profit: 0, count: 0, voids: 0, units: 0, items: {}, ids: {}, pay: {cash: 0, card: 0, ewallet: 0}};
  for (const b of bills) {
    if (b.void) { r.voids++; continue; }
    r.count++; r.sales += b.total; r.net += b.sub;
    r.pay[b.pay] = (r.pay[b.pay] || 0) + b.total;
    for (const l of b.lines) {
      r.profit += (l.price - (l.cost || 0)) * l.qty; r.units += l.qty;
      const it = r.items[l.name] || (r.items[l.name] = {qty: 0, amt: 0});
      it.qty += l.qty; it.amt += l.price * l.qty;
      r.ids[l.id] = (r.ids[l.id] || 0) + l.qty;
    }
  }
  return r;
}
function hhOn(set, now) {
  const h = set.hh; if (!h || !h.on) return false;
  now = now || new Date();
  const mins = t => { const p = String(t || "0:0").split(":"); return (+p[0] || 0) * 60 + (+p[1] || 0); };
  const a = mins(h.from), b = mins(h.to), m = now.getHours() * 60 + now.getMinutes(), d = now.getDay();
  const ok = x => !h.days || h.days.includes(x);
  if (a === b) return false;
  if (a < b) return m >= a && m < b && ok(d);
  if (m >= a) return ok(d);
  if (m < b) return ok((d + 6) % 7);
  return false;
}
/*END*/

/* ---------- state ---------- */
const DEF = {name: "My Bar", svc: 10, tax: 6, round5: true, cut: 5, hh: {on: false, from: "17:00", to: "20:00", days: [0, 1, 2, 3, 4, 5, 6]}};
const S = {menu: {items: []}, tabs: {tabs: {}}, settings: clone(DEF), days: {}};
const ui = {view: "orders", tab: null, cat: "All", range: 1, modal: null, ready: false, q: "", sort: "arrival"};
/* All data lives on this device, in the browser's localStorage, under keys starting "bcs:". */
const KEY = "bcs:";
let storeOk = true;
/* The business day runs past midnight: a bill at 1am belongs to the night before. */
const bizDate = () => new Date(Date.now() - (S.settings.cut ?? 5) * 3600e3);
const dayId = d => { d = d || bizDate(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

function setSync() {
  const el = $("#sync"); if (!el) return;
  el.className = "sync" + (storeOk ? "" : " off");
  el.lastElementChild.textContent = storeOk ? "Saved on this device" : "Not saving";
}
function save(path, get) {
  try { localStorage.setItem(KEY + path, JSON.stringify(get())); storeOk = true; }
  catch (e) {
    storeOk = false;
    note(e && e.name === "QuotaExceededError" ? "Storage on this device is full. Download a backup from Setup, then clear old sales days." : "This change could not be saved on the device. Check that the browser allows site storage.");
  }
  setSync();
}
function load(path, empty) {
  try { const raw = localStorage.getItem(KEY + path); return raw ? {...clone(empty), ...JSON.parse(raw)} : clone(empty); }
  catch (_) { return clone(empty); }
}
function loadAll() {
  S.menu = load("bar/menu", {items: []});
  S.tabs = load("bar/tabs", {tabs: {}});
  S.settings = load("bar/settings", DEF);
  S.days = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(KEY + "days/")) { const id = k.slice((KEY + "days/").length); S.days[id] = load("days/" + id, {bills: []}); }
  }
}

/* ---------- backup and restore ---------- */
function backupData() {
  const data = {app: "bar-counter-system", version: 1, saved: new Date().toISOString(), menu: S.menu, tabs: S.tabs, settings: S.settings, days: S.days};
  const blob = new Blob([JSON.stringify(data)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bar-backup-" + dayId(new Date()) + "-" + pad(new Date().getHours()) + pad(new Date().getMinutes()) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  try { localStorage.setItem(KEY + "lastBackup", String(Date.now())); } catch (_) {}
  toast("Backup downloaded. Keep a copy off the tablet too.");
}
function restoreData(file) {
  const r = new FileReader();
  r.onload = () => {
    let d;
    try { d = JSON.parse(r.result); } catch (_) { return toast("That file is not a bar backup."); }
    if (!d || d.app !== "bar-counter-system" || !d.menu || !d.days) return toast("That file is not a bar backup.");
    if (!window.confirm("Replace everything on this device with the backup from " + new Date(d.saved).toLocaleString() + "?")) return;
    for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && k.startsWith(KEY + "days/")) localStorage.removeItem(k); }
    S.menu = {items: [], ...d.menu}; S.tabs = {tabs: {}, ...d.tabs}; S.settings = {...clone(DEF), ...d.settings}; S.days = d.days || {};

    case "settings": return modal("settings", {});
    case "backup": backupData(); return renderModal();
    case "mock-add": if (!ui.ready) return; loadMockData(); modal(null); toast("Test data loaded. Remove it any time from Setup."); break;
    case "mock-del": removeMockData(); modal(null); toast("Test data removed"); break;
    case "close": return modal(null);
  }
  render();
});
document.addEventListener("input", e => {
  const id = e.target.id, m = ui.modal, t = curTab();
  if (id === "f-q") { ui.q = e.target.value; const c = $("#custs"); if (c) c.innerHTML = custCards(); }
  else if (id === "f-target" && m) m.target = e.target.value;
  else if (id === "f-newname" && m) m.newname = e.target.value;
  else if (id === "f-float" || id === "f-counted") updateDiff();
  else if (id === "f-cash" && t && m) {
    const due = totals(pickLines(t, m.sel), S.settings, "cash").total, given = toSen(e.target.value);
    $("#change").textContent = !given ? "" : given < due ? rm(due - given) + " short" : "Change " + rm(given - due);
  } else if (id === "f-people" && t && m) {
    const n = parseInt(e.target.value, 10), due = totals(pickLines(t, m.sel), S.settings, m.method).total;
    $("#each").textContent = n >= 2 ? "Each person pays " + rm(Math.ceil(due / n)) + "." : "";
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "f-restore" && e.target.files && e.target.files[0]) { restoreData(e.target.files[0]); e.target.value = ""; }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-f]"); if (!f) return;
  e.preventDefault();
  const v = n => (f.elements[n] ? f.elements[n].value.trim() : "");
  const on = n => !!(f.elements[n] && f.elements[n].checked);
  const m = ui.modal, kind = f.dataset.f;
  if (kind === "item") {
    const p = Math.max(1, parseInt(v("f-pours"), 10) || 1), ucost = toSen(v("f-ucost"));
    const d = {name: v("f-name"), cat: v("f-cat") || "Other", price: toSen(v("f-price")), hh: toSen(v("f-hh")), dbl: toSen(v("f-dbl")), pours: p, ucost, cost: Math.round(ucost / p),
      stock: Math.round((parseFloat(v("f-stock")) || 0) * p), low: Math.round((parseFloat(v("f-low")) || 0) * p), fav: on("f-fav")};
    if (m.id) Object.assign(item(m.id), d); else S.menu.items.push({id: uid(), ...d});
    saveMenu();
  } else if (kind === "restock") {
    const it = item(m.id); it.stock = (it.stock || 0) + Math.round((parseFloat(v("f-qty")) || 0) * pours(it)); saveMenu(); toast(it.name + ": " + fmtStock(it) + " in stock");
  } else if (kind === "tabname") {
    if (m && m.rename && curTab()) { curTab().name = v("f-tab"); saveTabs(); } else { newTab(v("f-tab")); f.reset(); }
  } else if (kind === "close") {
    const id = dayId(), day = S.days[id] || (S.days[id] = {bills: []});
    const fl = toSen(v("f-float")), counted = toSen(v("f-counted")), cash = summarise(day.bills).pay.cash;
    day.close = {t: Date.now(), float: fl, counted, cash, diff: counted - fl - cash};
    saveDay(id);
    if (submitter && submitter.dataset.print) printText(closingText(id, day.close), "closing-" + id);
  } else if (kind === "settings") {
    S.settings = {name: v("f-bar") || "My Bar", svc: parseFloat(v("f-svc")) || 0, tax: parseFloat(v("f-tax")) || 0, round5: on("f-round"),
      cut: Math.max(0, Math.min(12, parseInt(v("f-cut"), 10) || 0)),
      hh: {on: on("f-hhon"), from: v("f-hhfrom") || "17:00", to: v("f-hhto") || "20:00", days: [0, 1, 2, 3, 4, 5, 6].filter(n => on("f-d" + n))}};
    saveSettings();
  }
  submitter = null;
  modal(null); render();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.modal) modal(null); });

/* ---------- start ---------- */
async function start() {
  try { const v = localStorage.getItem("bar-view"); if (["orders", "stock", "reports"].includes(v)) ui.view = v; } catch (_) {}
  render();
  let lastHH = false;
  setInterval(() => { const now = hhOn(S.settings); if (now !== lastHH) { lastHH = now; if (!ui.modal) render(); } }, 30000);
  try { localStorage.setItem(KEY + "test", "1"); localStorage.removeItem(KEY + "test"); }
  catch (_) { storeOk = false; note("This browser is blocking storage, so nothing will be saved. Open the app in Chrome, not in private mode."); }
  loadAll();
  ui.ready = true;
  render();
  /* Ask Android not to clear the app's data when space runs low. */
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  /* Another tab of the app changed the data: reload it here too. */
  window.addEventListener("storage", e => { if (e.key && e.key.startsWith(KEY)) { loadAll(); if (!ui.modal) render(); } });
}
start();
</script>
