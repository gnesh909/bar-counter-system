<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar Counter System</title>
<meta name="theme-color" content="#12181a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a dim back-bar console; the open bill is the one bright object, a paper docket. */
:root{
  color-scheme:dark;
  --bg:#12181a;
  --panel:#1b2427;
  --panel-2:#243034;
  --line:#33444a;
  --ink:#ece6d8;
  --muted:#93a3a3;
  --brass:#e2a63b;
  --brass-ink:#1d1403;
  --paper:#f2ead8;
  --paper-ink:#25211a;
  --ok:#5fc28b;
  --warn:#f0a04b;
  --crit:#ef6a5b;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:26px;line-height:1;color:var(--brass)}
nav{display:flex;gap:4px;flex:1}
nav button{background:none;border:0;padding:8px 14px;border-radius:6px;font-weight:600;color:var(--muted)}
nav button[aria-current="true"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--brass)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.busy i{background:var(--warn)}
.sync.off i{background:var(--crit)}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:7px 12px}
.ghost:hover{border-color:var(--muted)}
.note{margin:0;padding:8px 16px;background:#3a2c12;color:#f6d9a0;font-size:13px}
main{flex:1;overflow:auto;padding:16px}
.empty{color:var(--muted);padding:28px 8px;text-align:center}

/* Orders */
.orders{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.chip small{color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.chip[aria-pressed="true"] small{color:var(--brass-ink)}
.chip.new{border-style:dashed;color:var(--brass)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cats button{background:none;border:0;border-bottom:2px solid transparent;padding:4px 8px;color:var(--muted);font-family:var(--display);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.cats button[aria-pressed="true"]{color:var(--ink);border-color:var(--brass)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:92px}
.item:hover{border-color:var(--brass)}
.item:active{transform:translateY(1px)}
.item b{font-weight:600;line-height:1.25}
.item .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:6px}
.item .price{font-family:var(--mono);color:var(--brass)}
.pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.crit{color:var(--crit)}

.docket{background:var(--paper);color:var(--paper-ink);font-family:var(--mono);font-size:13px;padding:18px 16px 22px;position:sticky;top:0;
  --z:linear-gradient(-45deg,var(--bg) 5px,transparent 0),linear-gradient(45deg,var(--bg) 5px,transparent 0)}
.docket::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--z);background-size:10px 10px;background-position:left bottom;background-repeat:repeat-x}
.docket h2{font-size:24px;text-align:center}
.docket .meta{text-align:center;color:#6d6555;margin:2px 0 10px}
.docket hr{border:0;border-top:1px dashed #a89d85;margin:10px 0}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:5px 0}
.line .q{display:flex;align-items:center;gap:6px;color:#6d6555}
.q button{width:26px;height:26px;border-radius:50%;border:1px solid #a89d85;background:none;color:var(--paper-ink);font-weight:700;line-height:1}
.tot{display:flex;justify-content:space-between;padding:2px 0}
.tot.big{font-family:var(--display);font-size:30px;font-weight:800;margin-top:6px}
.docket .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.primary{background:var(--brass);color:var(--brass-ink);border:0;border-radius:6px;padding:11px 14px;font-weight:700;font-family:var(--body);flex:1}
.primary:disabled{opacity:.45;cursor:not-allowed}
.docket .plain:disabled{opacity:.45}
.docket .plain{background:none;border:1px solid #a89d85;color:var(--paper-ink);border-radius:6px;padding:10px 12px;font-family:var(--body);font-weight:600}
.jump{display:none}

.addc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:18px}
.addc label{font-family:var(--display);font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--brass);flex-basis:100%}
.addc input{flex:1 1 200px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:16px;color:var(--ink)}
.addc .primary{flex:0 0 auto}
.custs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cust{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:8px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px}
.cust:hover{border-color:var(--brass)}
.cust b{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.cust .what{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cust .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:auto}
.cust small{color:var(--muted)}
.cust .price{font-family:var(--mono);color:var(--brass);font-size:16px}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tools input{flex:1 1 180px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 12px;color:var(--ink)}
.sub{font-size:16px;color:var(--muted);margin:0 0 8px}
.grid.quick{margin-bottom:18px}
.grid.quick .item{border-color:var(--brass);background:#2a2716}
.hhbar{margin:0 0 12px;padding:8px 12px;border-radius:6px;background:#3a2c12;color:#f6d9a0;font-weight:600}
.pill.hh{color:var(--brass)}
.mini{border:1px solid #a89d85;background:none;color:var(--paper-ink);border-radius:999px;padding:2px 9px;font:600 11px var(--body);margin-left:4px}
.hint{color:var(--muted);margin:0 0 10px;font-size:13px}
.selrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.selrow small{color:var(--muted)}
.selrow .q{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.selrow .q button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-weight:700}
.seltot{margin:10px 0 0;text-align:right}
.live{font-weight:600;min-height:1.4em;margin:8px 0 0}
.warnbox{background:#3a2c12;color:#f6d9a0;border-radius:6px;padding:8px 10px;margin:0 0 10px}
.closebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:8px;padding:10px 14px;margin-bottom:18px}
.f>.w,.f>.acts,.f>h3,.f>p{grid-column:1/-1}
.f select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:15px;color:var(--ink);width:100%}
.f label.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.f label.chk input,.days7 input{width:auto}
.days7{display:flex;flex-wrap:wrap;gap:6px 12px}
.days7 label{flex-direction:row;align-items:center;gap:5px;font-size:13px;color:var(--ink)}
.primary:disabled,.ghost:disabled{opacity:.45;cursor:not-allowed}

/* Stock + reports */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tile strong{display:block;font-family:var(--display);font-size:32px;line-height:1.1}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:880px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;background:var(--panel)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tr.crit td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
tr.warn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 12px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.card h3{font-size:18px;margin-bottom:10px}
.rank{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;margin-bottom:9px}
.rank i{grid-column:1/-1;height:6px;border-radius:3px;background:var(--brass);min-width:2px}
.days{display:flex;align-items:flex-end;gap:4px;height:150px;border-bottom:1px solid var(--line)}
.days div{flex:1;background:linear-gradient(var(--brass),#8a6522);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.days div.today{outline:1px solid var(--ink)}
.days div b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:500 10px var(--mono);color:var(--muted);padding-bottom:2px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.bills button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0;text-align:left}
.bills button:last-child{border:0}
.bills .void{text-decoration:line-through;color:var(--muted)}

/* Modal */
.veil{position:fixed;inset:0;background:rgba(5,9,10,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(440px,100%);max-height:100%;overflow:auto}
.dialog h2{font-size:24px;margin-bottom:12px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.f label.w{grid-column:1/-1}
.f input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:15px;color:var(--ink);width:100%}
.dialog .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.danger{background:none;border:1px solid var(--crit);color:var(--crit);border-radius:6px;padding:9px 12px;font-weight:600}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.methods button{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px 6px;font-weight:600}
.methods button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.due{font-family:var(--display);font-size:44px;font-weight:800;line-height:1;color:var(--brass)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.receipt{background:var(--paper);color:var(--paper-ink);font:13px/1.5 var(--mono);padding:14px;white-space:pre-wrap;border-radius:4px;overflow-x:auto}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;z-index:20;max-width:90%}

@media (max-width:860px){
  .orders{grid-template-columns:1fr}
  .docket{position:relative}
  .jump{display:flex;position:sticky;bottom:0;margin:14px -16px -16px;padding:10px 16px;background:var(--panel-2);border-top:1px solid var(--line);justify-content:space-between;align-items:center;gap:10px}
  .jump button{flex:0 0 auto}
  header h1{font-size:22px}
  nav{order:3;flex-basis:100%}
  nav button{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#printarea{display:none}
@media print{
  @page{margin:4mm}
  html,body{height:auto;background:#fff!important;color:#000!important;display:block}
  body>*:not(#printarea){display:none!important}
  #printarea{display:block;margin:0;font:12px/1.45 "DM Mono",ui-monospace,Menlo,Consolas,monospace;white-space:pre;color:#000}
}
</style>
</head>
<body>
<header>
  <h1 id="barname">My Bar</h1>
  <nav aria-label="Sections">
    <button data-a="nav" data-v="orders">Customers</button>
    <button data-a="nav" data-v="stock">Stock</button>
    <button data-a="nav" data-v="reports">Reports</button>
  </nav>
  <span class="sync" id="sync"><i></i><span>Connecting</span></span>
  <button class="ghost" data-a="settings">Setup</button>
</header>
<p class="note" id="note" hidden></p>
<main id="main"><p class="empty">Loading your bar…</p></main>
<div id="modal"></div>
<div id="toast" class="toast" hidden role="status"></div>
<pre id="printarea" aria-hidden="true"></pre>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, "0");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const rm = sen => "RM " + (sen / 100).toLocaleString("en-MY", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const toSen = v => Math.round((parseFloat(v) || 0) * 100);
const hhmm = t => new Date(t).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
const PAY = {cash: "Cash", card: "Card", ewallet: "E-wallet / QR"};

/*PURE*/
function totals(lines, set, method) {
  const sub = lines.reduce((a, l) => a + l.price * l.qty, 0);
  const svc = Math.round(sub * (set.svc || 0) / 100);
  const tax = Math.round((sub + svc) * (set.tax || 0) / 100);
  const raw = sub + svc + tax;
  const round = method === "cash" && set.round5 ? Math.round(raw / 5) * 5 - raw : 0;
  return {sub, svc, tax, round, total: raw + round};
}
function summarise(bills) {
  const r = {sales: 0, net: 0, profit: 0, count: 0, voids: 0, units: 0, items: {}, ids: {}, pay: {cash: 0, card: 0, ewallet: 0}};
  for (const b of bills) {
    if (b.void) { r.voids++; continue; }
    r.count++; r.sales += b.total; r.net += b.sub;
    r.pay[b.pay] = (r.pay[b.pay] || 0) + b.total;
    for (const l of b.lines) {
      r.profit += (l.price - (l.cost || 0)) * l.qty; r.units += l.qty;
      const it = r.items[l.name] || (r.items[l.name] = {qty: 0, amt: 0});
      it.qty += l.qty; it.amt += l.price * l.qty;
      r.ids[l.id] = (r.ids[l.id] || 0) + l.qty;
    }
  }
  return r;
}
function hhOn(set, now) {
  const h = set.hh; if (!h || !h.on) return false;
  now = now || new Date();
  const mins = t => { const p = String(t || "0:0").split(":"); return (+p[0] || 0) * 60 + (+p[1] || 0); };
  const a = mins(h.from), b = mins(h.to), m = now.getHours() * 60 + now.getMinutes(), d = now.getDay();
  const ok = x => !h.days || h.days.includes(x);
  if (a === b) return false;
  if (a < b) return m >= a && m < b && ok(d);
  if (m >= a) return ok(d);
  if (m < b) return ok((d + 6) % 7);
  return false;
}
/*END*/

/* ---------- state ---------- */
const DEF = {name: "My Bar", svc: 10, tax: 6, round5: true, cut: 5, hh: {on: false, from: "17:00", to: "20:00", days: [0, 1, 2, 3, 4, 5, 6]}};
const S = {menu: {items: []}, tabs: {tabs: {}}, settings: clone(DEF), days: {}};
const ui = {view: "orders", tab: null, cat: "All", range: 1, modal: null, ready: false, q: "", sort: "arrival"};
/* Data is shared through Supabase. Each device also keeps a copy in localStorage ("bcs:" keys),
   so it opens and takes orders with no internet; queued changes are sent when the connection returns. */
const KEY = "bcs:";
const SB_URL = "https://kmvrsflgswpcrmyoxgme.supabase.co";
const SB_KEY = "sb_publishable_TlwlvoyEHTlHc8YKPCM3QQ_0DUZgFZ2";
const KEEP_DAYS = 62; /* sales days kept on each device; older days stay safe on the server */
let storeOk = true;
/* The business day runs past midnight: a bill at 1am belongs to the night before. */
const bizDate = () => new Date(Date.now() - (S.settings.cut ?? 5) * 3600e3);
const dayId = d => { d = d || bizDate(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

/* ---------- local storage helpers ---------- */
const lsGet = (k, d) => { try { const r = localStorage.getItem(KEY + k); return r ? JSON.parse(r) : d; } catch (_) { return d; } };
function lsSet(k, v) {
  try { localStorage.setItem(KEY + k, JSON.stringify(v)); storeOk = true; }
  catch (e) {
    storeOk = false;
    note(e && e.name === "QuotaExceededError" ? "Storage on this device is full. Sign out and back in to reload only recent days." : "This device is blocking storage. Open the app in Chrome, not in private mode.");
  }
}
/* Data saved by the earlier version of the app, which kept everything on one tablet. */
function legacyLoad() {
  const g = (p, e) => ({...clone(e), ...lsGet(p, {})});
  const out = {menu: g("bar/menu", {items: []}), tabs: g("bar/tabs", {tabs: {}}), settings: g("bar/settings", DEF), days: {}};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(KEY + "days/")) out.days[k.slice((KEY + "days/").length)] = g(k.slice(KEY.length), {bills: []});
  }
  const has = out.menu.items.length || Object.keys(out.tabs.tabs).length || Object.keys(out.days).length;
  return has ? out : null;
}
function legacyClear() {
  for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && (k.startsWith(KEY + "days/") || k.startsWith(KEY + "bar/"))) localStorage.removeItem(k); }
}

/* ---------- sync engine ----------
   The app works on S as before. Every change is turned into small documents
   (one per menu item, customer, bill and day closing, plus settings), compared with
   the last known copy, and only the differences are queued and sent. */
let sb = null, user = lsGet("user", null), channel = null, online = false;
if (user && !user.bar) user = null; /* saved by an older version: sign in again */
const isAdmin = () => !!user && user.role === "admin";
const ADMIN_ONLY = "Only the admin login can do that.";
let docs = lsGet("docs", {}), queue = lsGet("queue", []), inflight = 0, flushT = null, commitQ = false;
const DEV = lsGet("dev", null) || (() => { const d = "ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random() * 24)] + Math.floor(Math.random() * 10); lsSet("dev", d); return d; })();

function toDocs() {
  const d = {settings: S.settings};
  S.menu.items.forEach((it, i) => { d["item/" + it.id] = {...it, order: i}; });
  for (const t of Object.values(S.tabs.tabs)) d["tab/" + t.id] = t;
  for (const id in S.days) {
    const day = S.days[id];
    for (const b of day.bills || []) d["bill/" + id + "/" + b.id] = b;
    if (day.close) d["close/" + id] = day.close;
  }
  return d;
}
function fromDocs() {
  const items = [], tabs = {}, days = {};
  const dayOf = id => days[id] || (days[id] = {bills: []});
  for (const p in docs) {
    const v = docs[p];
    if (p.startsWith("item/")) items.push(clone(v));
    else if (p.startsWith("tab/")) tabs[v.id] = clone(v);
    else if (p.startsWith("bill/")) dayOf(p.split("/")[1]).bills.push(clone(v));
    else if (p.startsWith("close/")) dayOf(p.slice(6)).close = clone(v);
  }
  items.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  for (const id in days) days[id].bills.sort((a, b) => a.t - b.t);
  S.settings = {...clone(DEF), ...clone(docs.settings || {})};
  S.menu = {items}; S.tabs = {tabs}; S.days = days;
}
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function commit() {
  commitQ = false;
  const next = toDocs();
  const push = op => {
    /* Merge with a change for the same document that has not been sent yet. */
    const j = queue.findIndex((q, i) => i >= inflight && q.path === op.path);
    if (j >= 0) { const q = queue[j]; op.delta = (q.delta != null || op.delta != null) ? (q.delta || 0) + (op.delta || 0) : null; if (q.isNew) op.isNew = true; queue[j] = op; }
    else queue.push(op);
  };
  for (const p in next) {
    const a = docs[p], b = clone(next[p]);
    if (a && same(a, b)) continue;
    const op = {path: p, data: b, delta: null};
    if (p.startsWith("item/")) { if (a) op.delta = (b.stock || 0) - (a.stock || 0); else op.isNew = true; }
    push(op); docs[p] = b;
  }
  for (const p in docs) if (!(p in next)) { push({path: p, data: docs[p], del: true, delta: null}); delete docs[p]; }
  lsSet("docs", docs); lsSet("queue", queue);
  setSync(); flush();
}
function scheduleCommit() { if (!commitQ) { commitQ = true; queueMicrotask(commit); } }

async function flush() {
  clearTimeout(flushT);
  if (inflight || !queue.length || !sb || !user) return setSync();
  const batch = queue.slice(0, 100).map(o => ({path: o.path, data: o.data, delta: o.isNew ? null : o.delta, del: !!o.del}));
  inflight = batch.length; setSync();
  try {
    const {data: skipped, error} = await sb.rpc("bar_put_many", {p_bar: user.bar, p_ops: batch});
    if (error) throw error;
    queue.splice(0, inflight); inflight = 0; online = true; lsSet("queue", queue);
    /* Changes this login isn't allowed to make are refused by the server: put back the real values. */
    if (skipped && skipped.length) toast(ADMIN_ONLY + " That change was undone.");
    refreshDocs([...new Set([...(skipped || []), ...batch.filter(o => o.path.startsWith("item/") && !o.del).map(o => o.path)])]).catch(() => {});
    if (queue.length) return flush();
  } catch (e) {
    inflight = 0;
    if (/fetch|network/i.test(String(e && e.message))) online = false;
    if (e && /JWT|not signed in|401/i.test(String(e.message || e.code))) { await sb.auth.refreshSession().catch(() => {}); }
    flushT = setTimeout(flush, 6000);
  }
  setSync();
}
/* A document arrived from the server (another device, or the echo of our own change). */
function applyRemote(row) {
  if (!row || !row.path) return;
  if (queue.some(q => q.path === row.path)) return; /* our newer change is on its way */
  if (row.deleted) delete docs[row.path]; else docs[row.path] = row.data;
  lsSet("docs", docs);
  fromDocs(); scheduleRender();
}
let renderT = null;
/* Redraw the screen behind any open dialog; the dialog itself is left alone so typing is not lost. */
function scheduleRender() { clearTimeout(renderT); renderT = setTimeout(render, 40); }
/* Read documents back from the server: true stock totals after a sale (other devices may have sold
   the same item), and the real value of anything the server refused. */
async function refreshDocs(paths) {
  if (!paths.length) return;
  const {data, error} = await sb.from("bar_docs").select("path,data,deleted").eq("bar_id", user.bar).in("path", paths);
  if (error || !data) return;
  data.forEach(applyRemote);
  for (const p of paths) if (!data.some(r => r.path === p) && !queue.some(q => q.path === p) && docs[p]) { delete docs[p]; lsSet("docs", docs); fromDocs(); scheduleRender(); }
}

async function fullLoad() {
  const cut = new Date(bizDate().getTime() - KEEP_DAYS * 864e5);
  const cutId = dayId(cut);
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const {data, error} = await sb.from("bar_docs").select("path,data,deleted").eq("bar_id", user.bar).or(`path.not.like.bill/*,path.gte.bill/${cutId}`).range(from, from + 999);
    if (error) throw error;
    rows.push(...data); if (data.length < 1000) break;
  }
  const server = {};
  for (const r of rows) if (!r.deleted) server[r.path] = r.data;
  /* Put this device's unsent changes back on top of what the server has. */
  for (const q of queue) {
    if (q.del) { delete server[q.path]; continue; }
    if (q.path.startsWith("item/") && !q.isNew && server[q.path]) server[q.path] = {...q.data, stock: (server[q.path].stock || 0) + (q.delta || 0)};
    else server[q.path] = q.data;
  }
  docs = server; lsSet("docs", docs);
  fromDocs();
  return rows.length;
}
/* First sign-in on a device that already has data from the one-tablet version. */
async function migrateLegacy(serverCount) {
  const old = legacyLoad(); if (!old || !isAdmin()) return;
  if (serverCount && !window.confirm("This device has bar data from before syncing was added. Add it to the shared bar data? (Cancel keeps only the shared data.)")) { legacyClear(); return; }
  if (!serverCount) S.settings = old.settings;
  S.menu.items.push(...old.menu.items.filter(i => !item(i.id)));
  Object.assign(S.tabs.tabs, old.tabs.tabs);
  for (const id in old.days) {
    const d = S.days[id] || (S.days[id] = {bills: []});
    for (const b of old.days[id].bills || []) if (!d.bills.some(x => x.id === b.id)) d.bills.push(b);
    if (old.days[id].close && !d.close) d.close = old.days[id].close;
  }
  commit(); legacyClear();
  toast("This device's earlier data is now shared.");
}
async function connect() {
  if (!sb || !user) return;
  try {
    /* The admin may have changed this login's role, or removed it. */
    const me = await sb.rpc("bar_me");
    if (me.error) throw me.error;
    const row = me.data && me.data[0];
    if (!row || row.bar_id !== user.bar) { await dropLocal(); note("This login no longer has access to the bar. Ask the admin."); return; }
    if (row.role !== user.role) { user.role = row.role; lsSet("user", user); toast("This login is now " + (row.role === "admin" ? "an admin" : "a viewer") + "."); }
    const n = await fullLoad();
    online = true; note("");
    await migrateLegacy(n);
    render(); flush();
    if (channel) sb.removeChannel(channel);
    channel = sb.channel("bar-" + user.id)
      .on("postgres_changes", {event: "*", schema: "public", table: "bar_docs", filter: "bar_id=eq." + user.bar}, p => applyRemote(p.new))
      .subscribe(st => { live = st === "SUBSCRIBED"; });
  } catch (e) {
    online = false; setSync();
    clearTimeout(retryT); retryT = setTimeout(connect, 10000);
  }
}
/* If live updates are not connected, check for other devices' changes every 20 seconds. */
let live = false, retryT = null;
setInterval(() => { if (sb && user && !live && !inflight && document.visibilityState === "visible") fullLoad().then(() => { online = true; render(); flush(); }, () => { online = false; setSync(); }); }, 20000);
async function signIn(email, password, create) {
  const {data, error} = await (create ? sb.auth.signUp({email, password}) : sb.auth.signInWithPassword({email, password}));
  if (error) throw error;
  if (!data.session) throw new Error("Account created. Sign in now.");
  let me = await sb.rpc("bar_me"); if (me.error) throw me.error;
  let row = me.data && me.data[0];
  if (!row && create) {
    /* The very first login creates the bar and becomes its admin. */
    const c = await sb.rpc("bar_create", {p_name: "My Bar"}); if (c.error) { await sb.auth.signOut().catch(() => {}); throw c.error; }
    me = await sb.rpc("bar_me"); row = me.data && me.data[0];
  }
  if (!row) { await sb.auth.signOut().catch(() => {}); throw new Error("NOACCESS"); }
  if (user && (user.id !== data.user.id || user.bar !== row.bar_id)) { docs = {}; queue = []; }
  user = {id: data.user.id, email: data.user.email, bar: row.bar_id, role: row.role};
  lsSet("user", user); lsSet("docs", docs); lsSet("queue", queue);
  fromDocs(); ui.ready = true; await connect(); render();
}
async function dropLocal() {
  try { if (channel) sb.removeChannel(channel); await sb.auth.signOut(); } catch (_) {}
  user = null; docs = {}; queue = []; online = false; ui.members = null;
  ["user", "docs", "queue"].forEach(k => localStorage.removeItem(KEY + k));
  fromDocs(); ui.tab = null; modal(null); render();
}
async function signOut() {
  if (queue.length && !window.confirm(queue.length + " changes have not reached the server yet and will be lost. Sign out anyway?")) return;
  await dropLocal();
}
/* ---------- logins (admin) ---------- */
async function loadMembers() {
  const {data, error} = await sb.rpc("bar_members_list", {p_bar: user.bar});
  ui.members = error ? [] : data;
  if (ui.modal && ui.modal.kind === "settings") renderModal();
}
async function addLogin(email, password, role) {
  /* A separate, throwaway connection creates the new login, so the admin stays signed in here. */
  const tmp = window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: "bcs-tmp"}});
  let res = await tmp.auth.signUp({email, password});
  if (res.error && /already registered|already exists/i.test(res.error.message)) res = await tmp.auth.signInWithPassword({email, password});
  if (res.error) throw res.error;
  const uidNew = res.data.user && res.data.user.id; if (!uidNew) throw new Error("Could not create that login.");
  const {error} = await sb.rpc("bar_add_member", {p_bar: user.bar, p_user: uidNew, p_role: role});
  if (error) throw error;
  await loadMembers();
}

function setSync() {
  const el = $("#sync"); if (!el) return;
  const waiting = queue.length;
  let cls = "", txt = "Synced";
  if (!user) { cls = " off"; txt = "Not signed in"; }
  else if (!storeOk) { cls = " off"; txt = "Not saving"; }
  else if (!online) { cls = " busy"; txt = waiting ? "Offline · " + waiting + " waiting" : "Offline"; }
  else if (waiting) { cls = " busy"; txt = "Syncing " + waiting; }
  if (user) txt += " · " + (isAdmin() ? "Admin" : "Viewer");
  el.className = "sync" + cls; el.lastElementChild.textContent = txt;
}

/* ---------- backup and restore ---------- */
function backupData() {
  const data = {app: "bar-counter-system", version: 1, saved: new Date().toISOString(), menu: S.menu, tabs: S.tabs, settings: S.settings, days: S.days};
  const blob = new Blob([JSON.stringify(data)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bar-backup-" + dayId(new Date()) + "-" + pad(new Date().getHours()) + pad(new Date().getMinutes()) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  try { localStorage.setItem(KEY + "lastBackup", String(Date.now())); } catch (_) {}
  toast("Backup downloaded. Keep a copy off the tablet too.");
}
function restoreData(file) {
  const r = new FileReader();
  r.onload = () => {
    let d;
    try { d = JSON.parse(r.result); } catch (_) { return toast("That file is not a bar backup."); }
    if (!d || d.app !== "bar-counter-system" || !d.menu || !d.days) return toast("That file is not a bar backup.");
    if (!window.confirm("Replace the shared bar data on every device with the backup from " + new Date(d.saved).toLocaleString() + "?")) return;
    S.menu = {items: [], ...d.menu}; S.tabs = {tabs: {}, ...d.tabs}; S.settings = {...clone(DEF), ...d.settings}; S.days = d.days || {};
    commit();
    ui.tab = null; modal(null); render(); toast("Backup restored");
  };
  r.readAsText(file);
}
const saveMenu = scheduleCommit, saveTabs = scheduleCommit, saveSettings = scheduleCommit, saveDay = scheduleCommit;

function note(msg) { const n = $("#note"); n.textContent = msg || ""; n.hidden = !msg; }
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- domain actions ---------- */
const item = id => S.menu.items.find(i => i.id === id);
const curTab = () => S.tabs.tabs[ui.tab] || null;
const lkey = l => l.key || l.id;
const pours = it => Math.max(1, it.pours || 1);
function makeTab(name) {
  const id = uid(), n = Object.keys(S.tabs.tabs).length + 1;
  return S.tabs.tabs[id] = {id, name: name || "Customer " + n, opened: Date.now(), lines: []};
}
function newTab(name) { const t = makeTab(name); ui.tab = t.id; saveTabs(); return t; }
function addItem(id, dbl) {
  const it = item(id); if (!it) return;
  const tab = curTab(); if (!tab) return;
  dbl = !!(dbl && it.dbl);
  const hh = !dbl && it.hh > 0 && hhOn(S.settings);
  const units = dbl ? 2 : 1, key = id + (dbl ? "|d" : "") + (hh ? "|h" : "");
  const l = tab.lines.find(x => lkey(x) === key);
  if (l) l.qty++;
  else tab.lines.push({key, id, name: it.name + (dbl ? " (double)" : "") + (hh ? " (happy hour)" : ""), price: dbl ? it.dbl : hh ? it.hh : it.price, cost: (it.cost || 0) * units, units, qty: 1});
  it.stock = (it.stock || 0) - units;
  if (it.stock < 0) toast(it.name + ": stock count is below zero. Recount it.");
  saveTabs(); saveMenu();
}
function changeQty(key, d) {
  const tab = curTab(); if (!tab) return;
  const l = tab.lines.find(x => lkey(x) === key); if (!l) return;
  l.qty += d;
  const it = item(l.id); if (it) it.stock = (it.stock || 0) - d * (l.units || 1);
  if (l.qty <= 0) tab.lines = tab.lines.filter(x => x !== l);
  saveTabs(); saveMenu();
}
function toggleDouble(key) {
  const tab = curTab(), l = tab && tab.lines.find(x => lkey(x) === key); if (!l) return;
  const it = item(l.id); if (!it || !it.dbl) return;
  const toDouble = (l.units || 1) !== 2;
  changeQty(key, -1); addItem(l.id, toDouble);
}
function voidTab() {
  const tab = curTab(); if (!tab) return;
  for (const l of tab.lines) { const it = item(l.id); if (it) it.stock = (it.stock || 0) + l.qty * (l.units || 1); }
  delete S.tabs.tabs[tab.id]; ui.tab = null;
  saveTabs(); saveMenu();
}
function pickLines(tab, sel) {
  if (!sel) return tab.lines;
  return tab.lines.filter(l => sel[lkey(l)] > 0).map(l => ({...l, qty: Math.min(l.qty, sel[lkey(l)])}));
}
function takeLines(tab, sel) {
  for (const l of tab.lines) l.qty -= Math.min(l.qty, sel[lkey(l)] || 0);
  tab.lines = tab.lines.filter(l => l.qty > 0);
  if (!tab.lines.length) { delete S.tabs.tabs[tab.id]; if (ui.tab === tab.id) ui.tab = null; }
}
function moveLines(sel, targetId, newName) {
  const src = curTab(); if (!src) return null;
  const moving = clone(pickLines(src, sel)); if (!moving.length) return null;
  const dst = targetId ? S.tabs.tabs[targetId] : makeTab(newName); if (!dst) return null;
  for (const l of moving) {
    const d = dst.lines.find(x => lkey(x) === lkey(l) && x.price === l.price);
    if (d) d.qty += l.qty; else dst.lines.push(l);
  }
  takeLines(src, sel); saveTabs();
  return dst;
}
function closeBill(method, tendered, sel) {
  const tab = curTab(); if (!tab) return null;
  const lines = clone(pickLines(tab, sel)); if (!lines.length) return null;
  const id = dayId(), day = S.days[id] || (S.days[id] = {bills: []});
  const t = totals(lines, S.settings, method);
  const bill = {id: uid(), no: id.slice(5).replace("-", "") + "-" + pad(day.bills.length + 1) + DEV, t: Date.now(), tab: tab.name, lines, ...t, pay: method};
  if (method === "cash" && tendered) { bill.tendered = tendered; bill.change = tendered - t.total; }
  day.bills.push(bill);
  if (sel) takeLines(tab, sel); else { delete S.tabs.tabs[tab.id]; ui.tab = null; }
  saveDay(id); saveTabs();
  return {day: id, bill};
}
function reopenBill(dayKey, billId) {
  const b = ((S.days[dayKey] || {}).bills || []).find(x => x.id === billId); if (!b || b.void) return;
  b.void = true; b.reopened = true;
  const t = makeTab(b.tab); t.lines = clone(b.lines).map(l => ({...l, key: lkey(l)}));
  ui.tab = t.id; ui.view = "orders";
  saveDay(dayKey); saveTabs();
}
function receiptText(b) {
  const w = 34, row = (a, c) => a + " ".repeat(Math.max(1, w - a.length - c.length)) + c;
  const out = [S.settings.name.toUpperCase(), (b.open ? "Bill so far  " : "Bill " + b.no + "  ") + new Date(b.t).toLocaleString(), b.tab, "-".repeat(w)];
  for (const l of b.lines) out.push(row((l.qty + " x " + l.name).slice(0, w - 11), rm(l.price * l.qty)));
  out.push("-".repeat(w), row("Subtotal", rm(b.sub)));
  if (b.svc) out.push(row("Service charge", rm(b.svc)));
  if (b.tax) out.push(row("SST", rm(b.tax)));
  if (b.round) out.push(row("Rounding", rm(b.round)));
  out.push(row("TOTAL", rm(b.total)));
  if (b.open) out.push("", "Not yet paid"); else out.push(row("Paid by", PAY[b.pay] || b.pay));
  if (b.tendered) out.push(row("Cash given", rm(b.tendered)), row("Change", rm(b.change)));
  if (b.reopened) out.push("*** REOPENED ***"); else if (b.void) out.push("*** VOIDED ***");
  return out.join("\n");
}
function closingText(id, c) {
  const w = 34, row = (a, b) => a + " ".repeat(Math.max(1, w - a.length - b.length)) + b;
  const r = summarise((S.days[id] || {}).bills || []);
  return [S.settings.name.toUpperCase(), "Day closing " + id, "Printed " + new Date().toLocaleString(), "-".repeat(w),
    row("Bills closed", String(r.count)), row("Voided or reopened", String(r.voids)), row("TOTAL takings", rm(r.sales)), "-".repeat(w),
    row("Cash", rm(r.pay.cash)), row("Card", rm(r.pay.card)), row("E-wallet / QR", rm(r.pay.ewallet || 0)), "-".repeat(w),
    row("Opening float", rm(c.float)), row("Cash expected", rm(c.float + r.pay.cash)), row("Cash counted", rm(c.counted)),
    row(c.diff < 0 ? "SHORT" : c.diff > 0 ? "OVER" : "Balanced", rm(Math.abs(c.diff)))].join("\n");
}
/* Opens the device's own print screen with just the receipt text (works with Android print services and Bluetooth printer apps). */
function printText(text) {
  const p = $("#printarea"); p.textContent = text;
  setTimeout(() => { try { window.print(); } catch (_) { toast("Printing is blocked here. Use Copy instead."); } }, 60);
}

/* ---------- views ---------- */
function fmtStock(i) {
  const p = pours(i), s = i.stock || 0;
  if (p === 1 || s < 0) return String(s);
  return Math.floor(s / p) + " btl + " + (s % p);
}
const status = it => it.stock <= 0 ? ["crit", "Out"] : it.stock <= (it.low || 0) ? ["warn", "Low"] : ["ok", "OK"];
function rangeDays(n) { const out = [], d = bizDate(); for (let i = n - 1; i >= 0; i--) { const x = new Date(d); x.setDate(d.getDate() - i); out.push(dayId(x)); } return out; }
function quickItems() {
  const sold = summarise(rangeDays(30).flatMap(id => (S.days[id] || {}).bills || [])).ids;
  const pinned = S.menu.items.filter(i => i.fav);
  const top = S.menu.items.filter(i => !i.fav && sold[i.id]).sort((a, b) => sold[b.id] - sold[a.id]);
  return [...pinned, ...top].slice(0, 8);
}
function itemBtn(i, hh) {
  const [k, s] = status(i), h = hh && i.hh > 0;
  return `<button class="item" data-a="add" data-id="${i.id}"><b>${esc(i.name)}</b><span class="row"><span class="price num">${((h ? i.hh : i.price) / 100).toFixed(2)}</span>${h ? `<span class="pill hh">HH</span>` : ""}${k === "ok" ? "" : `<span class="pill ${k}">${s}</span>`}</span></button>`;
}
function menuGrid() {
  const items = S.menu.items;
  if (!items.length) return `<p class="empty">No drinks or food on the menu yet.<br><br>${isAdmin() ? `<button class="primary" style="flex:none" data-a="item-new">Add your first item</button>` : "The admin adds the menu under Stock."}</p>`;
  const cats = ["All", ...new Set(items.map(i => i.cat || "Other"))];
  if (!cats.includes(ui.cat)) ui.cat = "All";
  const hh = hhOn(S.settings), quick = quickItems();
  return `${hh ? `<p class="hhbar">Happy hour prices are on until ${esc(S.settings.hh.to)}.</p>` : ""}
    ${quick.length ? `<h3 class="sub">Quick keys</h3><div class="grid quick">${quick.map(i => itemBtn(i, hh)).join("")}</div>` : ""}
    <div class="cats">${cats.map(c => `<button data-a="cat" data-id="${esc(c)}" aria-pressed="${c === ui.cat}">${esc(c)}</button>`).join("")}</div>
    <div class="grid">${items.filter(i => ui.cat === "All" || (i.cat || "Other") === ui.cat).map(i => itemBtn(i, hh)).join("")}</div>`;
}
function custCards() {
  const q = ui.q.trim().toLowerCase();
  let tabs = Object.values(S.tabs.tabs).filter(x => !q || x.name.toLowerCase().includes(q));
  const amt = x => totals(x.lines, S.settings).total;
  tabs.sort(ui.sort === "name" ? (a, b) => a.name.localeCompare(b.name) : ui.sort === "amount" ? (a, b) => amt(b) - amt(a) : (a, b) => a.opened - b.opened);
  if (!tabs.length) return `<p class="empty">${q ? "No customer matches that name." : "No customers yet. Type a name above and press Add customer."}</p>`;

    }

    }
    case "sel-all": { const t = curTab(); if (t) t.lines.forEach(l => m.sel[lkey(l)] = l.qty); return renderModal(); }

      if (!target && !name) { toast("Type the new customer's name, or pick an existing customer."); return; }
      const dst = moveLines(m.sel, target, name);
      if (dst) toast("Moved to " + dst.name);
      modal(null); break;
    }
    case "void": return modal("void", {});

    case "item-new": return modal("item", {});

    case "item-del": S.menu.items = S.menu.items.filter(i => i.id !== id); saveMenu(); modal(null); break;
    case "restock": return modal("restock", {id});

    case "bill": { const [day, bid] = id.split("|"); return modal("bill", {day, id: bid}); }
    case "bill-void": { const b = S.days[m.day].bills.find(x => x.id === m.id); b.void = true; saveDay(m.day); renderModal(); break; }

    S.settings = {name: v("f-bar") || "My Bar", svc: parseFloat(v("f-svc")) || 0, tax: parseFloat(v("f-tax")) || 0, round5: on("f-round"),
      cut: Math.max(0, Math.min(12, parseInt(v("f-cut"), 10) || 0)),
      hh: {on: on("f-hhon"), from: v("f-hhfrom") || "17:00", to: v("f-hhto") || "20:00", days: [0, 1, 2, 3, 4, 5, 6].filter(n => on("f-d" + n))}};
    saveSettings();
  }
  submitter = null;
  modal(null); render();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.modal) modal(null); });

/* ---------- start ---------- */
async function start() {
  try { const v = localStorage.getItem("bar-view"); if (["orders", "stock", "reports"].includes(v)) ui.view = v; } catch (_) {}
  render();
  let lastHH = false;
  setInterval(() => { const now = hhOn(S.settings); if (now !== lastHH) { lastHH = now; if (!ui.modal) render(); } }, 30000);
  try { localStorage.setItem(KEY + "test", "1"); localStorage.removeItem(KEY + "test"); }
  catch (_) { storeOk = false; note("This browser is blocking storage, so nothing will be saved. Open the app in Chrome, not in private mode."); }
  /* Show this device's saved copy straight away, even with no internet. */
  fromDocs();
  ui.ready = true;
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  try { if (window.supabase) sb = window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: true, autoRefreshToken: true, storageKey: "bcs-auth"}}); } catch (_) { sb = null; }
  render();
  if (!sb) { if (user) note("Working offline. Changes are kept on this device and sent once the app can connect."); return; }
  if (user) {
    const {data} = await sb.auth.getSession().catch(() => ({data: {}}));
    if (data && data.session && data.session.user.id === user.id) connect();
    else if (navigator.onLine) { note("Please sign in again to keep syncing. Nothing on this device has been lost."); user = null; lsSet("user", null); render(); }
    else note("Working offline. Changes are kept on this device and sent once the app can connect.");
  }
  sb.auth.onAuthStateChange((ev, session) => { if (ev === "TOKEN_REFRESHED" && session) flush(); });
  window.addEventListener("online", () => { if (user) connect(); });
  window.addEventListener("offline", () => { online = false; setSync(); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && user && sb) connect(); });
}
start();
</script>
