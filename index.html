<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar Counter System</title>
<meta name="theme-color" content="#12181a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a dim back-bar console; the open bill is the one bright object, a paper docket. */
:root{
  color-scheme:dark;
  --bg:#12181a;
  --panel:#1b2427;
  --panel-2:#243034;
  --line:#33444a;
  --ink:#ece6d8;
  --muted:#93a3a3;
  --brass:#e2a63b;
  --brass-ink:#1d1403;
  --paper:#f2ead8;
  --paper-ink:#25211a;
  --ok:#5fc28b;
  --warn:#f0a04b;
  --crit:#ef6a5b;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:26px;line-height:1;color:var(--brass)}
nav{display:flex;gap:4px;flex:1}
nav button{background:none;border:0;padding:8px 14px;border-radius:6px;font-weight:600;color:var(--muted)}
nav button[aria-current="true"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--brass)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.busy i{background:var(--warn)}
.sync.off i{background:var(--crit)}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:7px 12px}
.ghost:hover{border-color:var(--muted)}
.note{margin:0;padding:8px 16px;background:#3a2c12;color:#f6d9a0;font-size:13px}
main{flex:1;overflow:auto;padding:16px}
.empty{color:var(--muted);padding:28px 8px;text-align:center}

/* Orders */
.orders{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.chip small{color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.chip[aria-pressed="true"] small{color:var(--brass-ink)}
.chip.new{border-style:dashed;color:var(--brass)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cats button{background:none;border:0;border-bottom:2px solid transparent;padding:4px 8px;color:var(--muted);font-family:var(--display);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.cats button[aria-pressed="true"]{color:var(--ink);border-color:var(--brass)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:92px}
.item:hover{border-color:var(--brass)}
.item:active{transform:translateY(1px)}
.item b{font-weight:600;line-height:1.25}
.item .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:6px}
.item .price{font-family:var(--mono);color:var(--brass)}
.pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.crit{color:var(--crit)}

.docket{background:var(--paper);color:var(--paper-ink);font-family:var(--mono);font-size:13px;padding:18px 16px 22px;position:sticky;top:0;
  --z:linear-gradient(-45deg,var(--bg) 5px,transparent 0),linear-gradient(45deg,var(--bg) 5px,transparent 0)}
.docket::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--z);background-size:10px 10px;background-position:left bottom;background-repeat:repeat-x}
.docket h2{font-size:24px;text-align:center}
.docket .meta{text-align:center;color:#6d6555;margin:2px 0 10px}
.docket hr{border:0;border-top:1px dashed #a89d85;margin:10px 0}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:5px 0}
.line .q{display:flex;align-items:center;gap:6px;color:#6d6555}
.q button{width:26px;height:26px;border-radius:50%;border:1px solid #a89d85;background:none;color:var(--paper-ink);font-weight:700;line-height:1}
.tot{display:flex;justify-content:space-between;padding:2px 0}
.tot.big{font-family:var(--display);font-size:30px;font-weight:800;margin-top:6px}
.docket .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.primary{background:var(--brass);color:var(--brass-ink);border:0;border-radius:6px;padding:11px 14px;font-weight:700;font-family:var(--body);flex:1}
.primary:disabled{opacity:.45;cursor:not-allowed}
.docket .plain:disabled{opacity:.45}
.docket .plain{background:none;border:1px solid #a89d85;color:var(--paper-ink);border-radius:6px;padding:10px 12px;font-family:var(--body);font-weight:600}
.jump{display:none}

.addc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:18px}
.addc label{font-family:var(--display);font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--brass);flex-basis:100%}
.addc input{flex:1 1 200px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:16px;color:var(--ink)}
.addc .primary{flex:0 0 auto}
.custs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cust{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:8px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px}
.cust:hover{border-color:var(--brass)}
.cust b{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.cust .what{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cust .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:auto}
.cust small{color:var(--muted)}
.cust .price{font-family:var(--mono);color:var(--brass);font-size:16px}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tools input{flex:1 1 180px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 12px;color:var(--ink)}
.sub{font-size:16px;color:var(--muted);margin:0 0 8px}
.grid.quick{margin-bottom:18px}
.grid.quick .item{border-color:var(--brass);background:#2a2716}
.hhbar{margin:0 0 12px;padding:8px 12px;border-radius:6px;background:#3a2c12;color:#f6d9a0;font-weight:600}
.pill.hh{color:var(--brass)}
.mini{border:1px solid #a89d85;background:none;color:var(--paper-ink);border-radius:999px;padding:2px 9px;font:600 11px var(--body);margin-left:4px}
.hint{color:var(--muted);margin:0 0 10px;font-size:13px}
.selrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.selrow small{color:var(--muted)}
.selrow .q{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.selrow .q button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-weight:700}
.seltot{margin:10px 0 0;text-align:right}
.live{font-weight:600;min-height:1.4em;margin:8px 0 0}
.warnbox{background:#3a2c12;color:#f6d9a0;border-radius:6px;padding:8px 10px;margin:0 0 10px}
.closebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:8px;padding:10px 14px;margin-bottom:18px}
.f>.w,.f>.acts,.f>h3,.f>p{grid-column:1/-1}
.f select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:15px;color:var(--ink);width:100%}
.f label.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.f label.chk input,.days7 input{width:auto}
.days7{display:flex;flex-wrap:wrap;gap:6px 12px}
.days7 label{flex-direction:row;align-items:center;gap:5px;font-size:13px;color:var(--ink)}
.primary:disabled,.ghost:disabled{opacity:.45;cursor:not-allowed}

/* Stock + reports */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tile strong{display:block;font-family:var(--display);font-size:32px;line-height:1.1}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:880px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;background:var(--panel)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tr.crit td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
tr.warn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 12px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.card h3{font-size:18px;margin-bottom:10px}
.rank{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;margin-bottom:9px}
.rank i{grid-column:1/-1;height:6px;border-radius:3px;background:var(--brass);min-width:2px}
.days{display:flex;align-items:flex-end;gap:4px;height:150px;border-bottom:1px solid var(--line)}
.days div{flex:1;background:linear-gradient(var(--brass),#8a6522);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.days div.today{outline:1px solid var(--ink)}
.days div b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:500 10px var(--mono);color:var(--muted);padding-bottom:2px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.bills button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0;text-align:left}
.bills button:last-child{border:0}
.bills .void{text-decoration:line-through;color:var(--muted)}

/* Modal */
.veil{position:fixed;inset:0;background:rgba(5,9,10,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(440px,100%);max-height:100%;overflow:auto}
.dialog h2{font-size:24px;margin-bottom:12px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.f label.w{grid-column:1/-1}
.f input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:15px;color:var(--ink);width:100%}
.dialog .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.danger{background:none;border:1px solid var(--crit);color:var(--crit);border-radius:6px;padding:9px 12px;font-weight:600}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.methods button{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px 6px;font-weight:600}
.methods button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.due{font-family:var(--display);font-size:44px;font-weight:800;line-height:1;color:var(--brass)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.receipt{background:var(--paper);color:var(--paper-ink);font:13px/1.5 var(--mono);padding:14px;white-space:pre-wrap;border-radius:4px;overflow-x:auto}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;z-index:20;max-width:90%}

@media (max-width:860px){
  .orders{grid-template-columns:1fr}
  .docket{position:relative}
  .jump{display:flex;position:sticky;bottom:0;margin:14px -16px -16px;padding:10px 16px;background:var(--panel-2);border-top:1px solid var(--line);justify-content:space-between;align-items:center;gap:10px}
  .jump button{flex:0 0 auto}
  header h1{font-size:22px}
  nav{order:3;flex-basis:100%}
  nav button{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#printarea,#printdoc{display:none}
@media print{
  @page{margin:4mm}
  html,body{height:auto;background:#fff!important;color:#000!important;display:block}
  body:not(.pdoc)>*:not(#printarea){display:none!important}
  body.pdoc>*:not(#printdoc){display:none!important}
  body.pdoc #printdoc{display:block;font:11pt/1.4 system-ui,sans-serif;color:#000}
  #printdoc h1{font-size:18pt;margin:0 0 2pt}#printdoc h2{font-size:13pt;margin:14pt 0 4pt}
  #printdoc table{border-collapse:collapse;width:100%;font-size:10pt}#printdoc th,#printdoc td{border-bottom:1px solid #bbb;padding:3pt 5pt;text-align:left}
  #printdoc .r{text-align:right}#printdoc .muted{color:#555}
  #printarea{display:block;margin:0;font:12px/1.45 "DM Mono",ui-monospace,Menlo,Consolas,monospace;white-space:pre;color:#000}
}
</style>
</head>
<body>
<header>
  <h1 id="barname">My Bar</h1>
  <nav aria-label="Sections">
    <button data-a="nav" data-v="orders">Customers</button>
    <button data-a="nav" data-v="stock">Stock</button>
    <button data-a="nav" data-v="reports">Reports</button>
    <button data-a="nav" data-v="history" hidden>History</button>
  </nav>
  <span class="sync" id="sync"><i></i><span>Connecting</span></span>
  <button class="ghost" data-a="settings">Setup</button>
</header>
<p class="note" id="note" hidden></p>
<main id="main"><p class="empty">Loading your bar…</p></main>
<div id="modal"></div>
<div id="toast" class="toast" hidden role="status"></div>
<pre id="printarea" aria-hidden="true"></pre>
<div id="printdoc" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, "0");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const rm = sen => "RM " + (sen / 100).toLocaleString("en-MY", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const toSen = v => Math.round((parseFloat(v) || 0) * 100);
const hhmm = t => new Date(t).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
const PAY = {cash: "Cash", card: "Card", ewallet: "E-wallet / QR"};
const CATS = ["Beer", "Spirits", "Wine", "Cocktails", "Soft drinks", "Food", "Snacks", "Games", "Other"];
const payName = k => PAY[k] || (k === "later" ? "Pay later" : k);

/*PURE*/
function totals(lines, set, method) {
  const sub = lines.reduce((a, l) => a + l.price * l.qty, 0);
  const svc = Math.round(sub * (set.svc || 0) / 100);
  const tax = Math.round((sub + svc) * (set.tax || 0) / 100);
  const raw = sub + svc + tax;
  const round = method === "cash" && set.round5 ? Math.round(raw / 5) * 5 - raw : 0;
  return {sub, svc, tax, round, total: raw + round};
}
function summarise(bills) {
  const r = {sales: 0, net: 0, profit: 0, count: 0, voids: 0, units: 0, items: {}, ids: {}, pay: {cash: 0, card: 0, ewallet: 0, later: 0}};
  for (const b of bills) {
    if (b.void) { r.voids++; continue; }
    r.count++; r.sales += b.total; r.net += b.sub;
    r.pay[b.pay] = (r.pay[b.pay] || 0) + b.total;
    for (const l of b.lines) {
      r.profit += (l.price - (l.cost || 0)) * l.qty; r.units += l.qty;
      const it = r.items[l.name] || (r.items[l.name] = {qty: 0, amt: 0});
      it.qty += l.qty; it.amt += l.price * l.qty;
      r.ids[l.id] = (r.ids[l.id] || 0) + l.qty;
    }
  }
  return r;
}
function hhOn(set, now) {
  const h = set.hh; if (!h || !h.on) return false;
  now = now || new Date();
  const mins = t => { const p = String(t || "0:0").split(":"); return (+p[0] || 0) * 60 + (+p[1] || 0); };
  const a = mins(h.from), b = mins(h.to), m = now.getHours() * 60 + now.getMinutes(), d = now.getDay();
  const ok = x => !h.days || h.days.includes(x);
  if (a === b) return false;
  if (a < b) return m >= a && m < b && ok(d);
  if (m >= a) return ok(d);
  if (m < b) return ok((d + 6) % 7);
  return false;
}
/*END*/

/* ---------- state ---------- */
const DEF = {name: "My Bar", email: "", svc: 10, tax: 6, round5: true, cut: 5, hh: {on: false, from: "17:00", to: "20:00", days: [0, 1, 2, 3, 4, 5, 6]}};
const S = {menu: {items: []}, tabs: {tabs: {}}, settings: clone(DEF), days: {}, custs: {}};
const ui = {view: "orders", rmode: "day", ranchor: null, rep: null, hist: null, backups: null, mailer: false, tab: null, cat: "All", range: 1, modal: null, ready: false, q: "", sort: "arrival"};
/* Data is shared through Supabase. Each device also keeps a copy in localStorage ("bcs:" keys),
   so it opens and takes orders with no internet; queued changes are sent when the connection returns. */
const KEY = "bcs:";
const SB_URL = "https://kmvrsflgswpcrmyoxgme.supabase.co";
const SB_KEY = "sb_publishable_TlwlvoyEHTlHc8YKPCM3QQ_0DUZgFZ2";
const KEEP_DAYS = 62; /* sales days kept on each device; older days stay safe on the server */
let storeOk = true;
/* The business day runs past midnight: a bill at 1am belongs to the night before. */
const bizDate = () => new Date(Date.now() - (S.settings.cut ?? 5) * 3600e3);
const dayId = d => { d = d || bizDate(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

/* ---------- local storage helpers ---------- */
const lsGet = (k, d) => { try { const r = localStorage.getItem(KEY + k); return r ? JSON.parse(r) : d; } catch (_) { return d; } };
function lsSet(k, v) {
  try { localStorage.setItem(KEY + k, JSON.stringify(v)); storeOk = true; }
  catch (e) {
    storeOk = false;
    note(e && e.name === "QuotaExceededError" ? "Storage on this device is full. Sign out and back in to reload only recent days." : "This device is blocking storage. Open the app in Chrome, not in private mode.");
  }
}
/* Data saved by the earlier version of the app, which kept everything on one tablet. */
function legacyLoad() {
  const g = (p, e) => ({...clone(e), ...lsGet(p, {})});
  const out = {menu: g("bar/menu", {items: []}), tabs: g("bar/tabs", {tabs: {}}), settings: g("bar/settings", DEF), days: {}};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(KEY + "days/")) out.days[k.slice((KEY + "days/").length)] = g(k.slice(KEY.length), {bills: []});
  }
  const has = out.menu.items.length || Object.keys(out.tabs.tabs).length || Object.keys(out.days).length;

/* ---------- cloud backup on day closing ---------- */
async function fetchAllDocs() {
  const out = {};
  for (let from = 0; ; from += 1000) {
    const {data, error} = await sb.from("bar_docs").select("path,data,deleted").eq("bar_id", user.bar).range(from, from + 999);
    if (error) throw error;
    for (const r of data) if (!r.deleted) out[r.path] = r.data;
    if (data.length < 1000) break;
  }
  return out;
}
/* Wait until every queued change has reached the server (or give up after a while). */
async function syncNow(ms = 15000) {
  const end = Date.now() + ms;
  while (queue.length && Date.now() < end) {
    if (!inflight) await flush();
    if (queue.length) await new Promise(r => setTimeout(r, 400));
  }
  return !queue.length;
}
async function cloudBackup(day) {
  if (!(sb && user)) { lsSet("pendingBackup", day); return "later"; }
  try {
    if (!(await syncNow())) throw new Error("unsent changes");
    const st = docsToState(await fetchAllDocs());
    const body = JSON.stringify({app: "bar-counter-system", version: 1, saved: new Date().toISOString(), day, by: user.email, menu: st.menu, tabs: st.tabs, settings: st.settings, days: st.days});
    const file = `${day}_${new Date().toISOString().replace(/[:.]/g, "-")}_${DEV}.json`;
    const {error} = await sb.storage.from("backups").upload(user.bar + "/" + file, new Blob([body], {type: "application/json"}), {upsert: false, contentType: "application/json"});
    if (error) throw error;
    await sb.rpc("bar_log_backup", {p_bar: user.bar, p_file: file, p_bytes: body.length});
    localStorage.removeItem(KEY + "pendingBackup");
    return "ok";
  } catch (e) { ui.backupError = String(e && e.message || e); lsSet("pendingBackup", day); return "later"; }
}

function updateDiff() {
  const f = document.querySelector('form[data-f="close"]'), el = $("#diff"); if (!f || !el) return;
  if ($("#f-counted").value === "") { el.textContent = ""; return; }
  const expected = toSen($("#f-float").value) + (+f.dataset.cash), d = toSen($("#f-counted").value) - expected;
  el.textContent = "Expected in drawer " + rm(expected) + ". " + (d === 0 ? "Balanced." : d < 0 ? "Short by " + rm(-d) + "." : "Over by " + rm(d) + ".");
}

/* ---------- events ---------- */
let submitter = null;
document.addEventListener("click", e => {
  const subBtn = e.target.closest('button[type="submit"]'); if (subBtn) submitter = subBtn;
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id, m = ui.modal;
  if (a === "veil") { if (e.target === el) modal(null); return; }
  if (["item-new", "item-edit", "item-del", "restock", "void", "void-yes", "reopen", "bill-void", "mock-add", "mock-del", "member-del", "cust-del"].includes(a) && !isAdmin()) { toast(ADMIN_ONLY); return; }
  switch (a) {
    case "nav": ui.view = el.dataset.v; try { localStorage.setItem("bar-view", ui.view); } catch (_) {} $("#main").scrollTop = 0; if (ui.view === "history") { ui.hist = null; loadHistory(); } if (ui.view === "reports") ui.rep = null; break;
    case "tab": ui.tab = id; $("#main").scrollTop = 0; break;
    case "back": ui.tab = null; $("#main").scrollTop = 0; break;
    case "sort": ui.sort = id; break;
    case "rename": return modal("tabname", {rename: true});
    case "cat": ui.cat = id; break;
    case "add": if (!ui.ready) return; addItem(id); break;
    case "inc": changeQty(id, 1); break;
    case "dec": changeQty(id, -1); break;
    case "dbl": toggleDouble(id); break;
    case "jump": { const d = $("#docket"); if (d) d.scrollIntoView({behavior: "smooth"}); return; }
    case "pay": return modal("pay", {method: "cash"});
    case "method": return modal("pay", {method: id, sel: m.sel});
    case "cash": { const i = $("#f-cash"); i.value = (id / 100).toFixed(2); i.dispatchEvent(new Event("input", {bubbles: true})); return; }
    case "unpaid": return modal("unpaid", {});
    case "repay": return modal("repay", {ref: id, method: "cash"});
    case "rmethod": { const amt = ($("#f-ramt") || {}).value; modal("repay", {ref: m.ref, method: id}); const i = $("#f-ramt"); if (i && amt) i.value = amt; return; }
    case "repay-yes": {
      const u = unpaidBills().find(x => x.ref === m.ref); if (!u) return modal(null);
      const amt = toSen(($("#f-ramt") || {}).value);
      if (amt <= 0) { $("#repaymsg").textContent = "Enter the amount received."; return; }
      if (amt > u.bal) { $("#repaymsg").textContent = "That's more than the " + rm(u.bal) + " owed."; return; }
      const r = addRepay(u, amt, m.method || "cash");
      render(); return modal("repaid", {text: repayText(r, u.bal - amt)});
    }
    case "print-repay": printText(m.text); return;
    case "pay-yes": {
      const t = curTab(); if (!t) return modal(null);
      if (m.method === "later" && !t.cid) {
        const c = S.custs[($("#f-latercid") || {}).value];
        if (!c) { toast("Choose which regular this bill belongs to."); return; }
        t.cid = c.id; t.name = c.name; saveTabs();
      }
      const due = totals(pickLines(t, m.sel), S.settings, m.method).total;
      const given = m.method === "cash" ? toSen(($("#f-cash") || {}).value) : 0;
      if (given && given < due) { $("#change").textContent = "That is " + rm(due - given) + " short."; return; }
      const res = closeBill(m.method, given, m.sel);
      render(); return res ? modal("bill", {day: res.day, id: res.bill.id, fresh: true}) : modal(null);
    }
    case "split": return modal("split", {sel: {}});
    case "sel-inc": case "sel-dec": {
      const t = curTab(), l = t && t.lines.find(x => lkey(x) === id); if (!l) return;
      m.sel[id] = Math.max(0, Math.min(l.qty, (m.sel[id] || 0) + (a === "sel-inc" ? 1 : -1))); return renderModal();
    }
    case "sel-all": { const t = curTab(); if (t) t.lines.forEach(l => m.sel[lkey(l)] = l.qty); return renderModal(); }
    case "sel-none": m.sel = {}; return renderModal();
    case "split-pay": return modal("pay", {method: "cash", sel: {...m.sel}});
    case "split-move": {
      const target = ($("#f-target") || {}).value || "", name = (($("#f-newname") || {}).value || "").trim();
      if (!target && !name) { toast("Type the new customer's name, or pick an existing customer."); return; }
      const dst = moveLines(m.sel, target, name);
      if (dst) toast("Moved to " + dst.name);
      modal(null); break;
    }
    case "void": return modal("void", {});
    case "void-yes": voidTab(); modal(null); break;
    case "item-new": return modal("item", {});
    case "item-edit": return modal("item", {id});
    case "item-del": S.menu.items = S.menu.items.filter(i => i.id !== id); saveMenu(); modal(null); break;
    case "restock": return modal("restock", {id});
    case "bill": { const [day, bid] = id.split("|"); return modal("bill", {day, id: bid}); }
    case "bill-void": { const b = S.days[m.day].bills.find(x => x.id === m.id); b.void = true; saveDay(m.day); renderModal(); break; }
    case "reopen": reopenBill(m.day, m.id); modal(null); $("#main").scrollTop = 0; break;
    case "closeday": return modal("close", {});
    case "copy": { const txt = $("#receipt").textContent; (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast("Receipt copied"), () => toast("Copy is blocked here. Select the text instead.")); return; }
    case "print": { const b = ((S.days[m.day] || {}).bills || []).find(x => x.id === m.id); if (b) printText(receiptText(b), "bill-" + b.no); return; }
    case "print-open": { const t = curTab(); if (t && t.lines.length) printText(receiptText({open: true, t: Date.now(), tab: t.name, lines: t.lines, ...totals(t.lines, S.settings)}), "bill-" + t.name.replace(/[^A-Za-z0-9]+/g, "-").slice(0, 30)); return; }
    case "settings": if (!user) return; if (isAdmin() && sb) { ui.members = null; ui.backups = null; loadMembers(); loadBackups(); } return modal("settings", {});
    case "backup-open": openBackup(id); return;
    case "rmode": ui.rmode = id; ui.rep = null; break;
    case "rprev": shiftPeriod(-1); break;
    case "rnext": shiftPeriod(1); break;
    case "rnow": ui.ranchor = null; ui.rep = null; break;
    case "rprint": printDoc(reportHTML(), period().title + " " + period().label); return;
    case "remail": emailReport(); return;
    case "hrefresh": ui.hist = null; loadHistory(); break;
    case "hmore": loadHistory(true); return;
    case "hprint": printDoc(historyHTML(), "change history"); return;
    case "mail-closing": { const c = S.days[m.day].close; openMailApp(`${S.settings.name}: day closing ${m.day}`, closingText(m.day, c), "Day closing " + m.day); return; }
    case "print-closing": printText(closingText(m.day, S.days[m.day].close)); logEvent("print", {what: "Day closing " + m.day}); return;
    case "cust-del": {
      const c = S.custs[id]; if (!c || !window.confirm("Remove " + c.name + " from regulars? Their past spending stays in the reports.")) return;
      delete S.custs[id]; scheduleCommit(); renderModal(); return;
    }
    case "cshow": { const r = (ui.cust && ui.cust.rows || []).find(x => x.key === id); if (r) openCustomer(r); return; }
    case "cregs": ui.custRegs = !ui.custRegs; break;
    case "member-pass": {
      const x = (ui.members || []).find(z => z.user_id === id); if (!x) return;
      const pw = window.prompt("New password for " + x.email + " (at least 8 characters). Tell them the new password; they will be signed out everywhere.");
      if (pw == null) return;
      if (pw.length < 8) { toast("The password must be at least 8 characters."); return; }
      sb.rpc("bar_reset_password", {p_bar: user.bar, p_user: id, p_pass: pw}).then(r => toast(r.error ? r.error.message : "Password changed for " + x.email));
      return;
    }
    case "forgot": {
      const em = (($("#f-email") || {}).value || "").trim(), msg = $("#authmsg");
      if (!em) { msg.textContent = "Type your email above first, then tap Forgot password."; return; }
      msg.textContent = "Sending…";
      sb.auth.resetPasswordForEmail(em, {redirectTo: location.origin + location.pathname}).then(r => {
        msg.textContent = r.error && !/rate|limit/i.test(r.error.message) ? "The reset email could not be sent. Ask your admin to reset your password under Setup → Logins."
          : r.error ? "Too many requests. Wait a few minutes, or ask your admin to reset your password."
          : "If " + em + " is a login of this bar, a reset link is on its way. If nothing arrives within a few minutes, ask your admin to reset your password under Setup → Logins.";
      });
      return;
    }
    case "member-del": {
      const x = (ui.members || []).find(z => z.user_id === id);
      if (!x || !window.confirm("Remove the login " + x.email + "? It will be signed out of the bar on every device.")) return;
      sb.rpc("bar_remove_member", {p_bar: user.bar, p_user: id}).then(r => { if (r.error) toast(r.error.message); else { toast("Login removed"); loadMembers(); } });
      return;
    }
    case "backup": backupData(); return renderModal();
    case "signout": signOut(); return;
    case "mock-add": if (!ui.ready) return; loadMockData(); modal(null); toast("Test data loaded. Remove it any time from Setup."); break;
    case "mock-del": removeMockData(); modal(null); toast("Test data removed"); break;
    case "close": return modal(null);
  }
  render();
});
document.addEventListener("input", e => {
  const id = e.target.id, m = ui.modal, t = curTab();
  if (id === "f-hemail") { ui.hist = {rows: [], done: false, email: e.target.value, type: (ui.hist || {}).type || ""}; loadHistory(); return; }
  if (id === "f-htype") { ui.hist = {rows: [], done: false, email: (ui.hist || {}).email || "", type: e.target.value}; loadHistory(); return; }
  if (id === "f-q") { ui.q = e.target.value; const c = $("#custs"); if (c) c.innerHTML = custCards(); }
  else if (id === "f-target" && m) m.target = e.target.value;
  else if (id === "f-newname" && m) m.newname = e.target.value;
  else if (id === "f-float" || id === "f-counted") updateDiff();
  else if (id === "f-cash" && t && m) {
    const due = totals(pickLines(t, m.sel), S.settings, "cash").total, given = toSen(e.target.value);
    $("#change").textContent = !given ? "" : given < due ? rm(due - given) + " short" : "Change " + rm(given - due);
  } else if (id === "f-people" && t && m) {
    const n = parseInt(e.target.value, 10), due = totals(pickLines(t, m.sel), S.settings, m.method).total;
    $("#each").textContent = n >= 2 ? "Each person pays " + rm(Math.ceil(due / n)) + "." : "";
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "f-catsel") { const nc = $("#newcat"), isNew = e.target.value === "__new"; nc.hidden = !isNew; $("#f-cat").required = isNew; if (isNew) $("#f-cat").focus(); return; }
  if (e.target.id === "f-restore" && !isAdmin()) { toast(ADMIN_ONLY); return; }
  if (e.target.id === "f-restore" && e.target.files && e.target.files[0]) { restoreData(e.target.files[0]); e.target.value = ""; }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-f]"); if (!f) return;
  e.preventDefault();
  const v = n => (f.elements[n] ? f.elements[n].value.trim() : "");
  const on = n => !!(f.elements[n] && f.elements[n].checked);
  const m = ui.modal, kind = f.dataset.f;
  if (kind === "signin") {
    const create = !!(submitter && submitter.dataset.create); submitter = null;
    const msg = $("#authmsg"), btns = f.querySelectorAll("button");
    ui.email = v("f-email");
    btns.forEach(b => b.disabled = true); msg.textContent = create ? "Creating the account…" : "Signing in…";
    signIn(v("f-email"), f.elements["f-pass"].value, create).catch(err => {
      const t = String(err && err.message || err);
      msg.textContent = /Invalid login/i.test(t) ? "Wrong email or password." : /already registered/i.test(t) ? "That email already has a login. Use Sign in." : t === "NOACCESS" ? "This login hasn't been given access yet. Ask the admin to add it under Setup → Logins." : /bar already exists/i.test(t) ? "The bar is already set up. Sign in with your login instead." : /fetch|network/i.test(t) ? "No internet connection. Connect, then try again." : t;
      if (/bar already exists/i.test(t)) { ui.barExists = true; setTimeout(render, 1500); }
      btns.forEach(b => b.disabled = false);
    });
    return;
  }
  if (kind === "mypass" || kind === "newpass") {
    const a1 = f.elements[kind === "mypass" ? "f-np1" : "f-rp1"].value, a2 = f.elements[kind === "mypass" ? "f-np2" : "f-rp2"].value;
    const msg = $(kind === "mypass" ? "#mypassmsg" : "#newpassmsg");
    if (a1 !== a2) { msg.textContent = "The two passwords don't match."; return; }
    msg.textContent = "Saving…";
    sb.auth.updateUser({password: a1}).then(async r => {
      if (r.error) { msg.textContent = /same|different/i.test(r.error.message) ? "Pick a password different from the old one." : r.error.message; return; }
      if (kind === "mypass") { logEvent("password_change", {device: DEV}); msg.textContent = "✓ Password changed. Use it next time you sign in."; f.reset(); return; }
      logEvent("password_change", {device: DEV, via: "reset link"});
      const {data} = await sb.auth.getSession();
      modal(null);
      try { await finishAuth({user: data.session.user, session: data.session}, false, "reset link"); toast("Password changed. You're signed in."); }
      catch (e) { ui.barExists = true; render(); toast(String(e.message) === "NOACCESS" ? "Password changed, but this login has no access to the bar. Ask the admin." : "Password changed. Sign in with it now."); }
    });
    return;
  }
  if (kind === "addcust") {
    if (!isAdmin()) { toast(ADMIN_ONLY); return; }
    const name = tidy(v("f-cname")); if (!name) return;
    if (findRegular(name)) { toast(name + " is already a regular."); return; }
    const id = uid(); S.custs[id] = {id, name, phone: v("f-cphone")};
    /* Open customers with the same name now count as this regular. */
    for (const t of Object.values(S.tabs.tabs)) if (!t.cid && tidy(t.name).toLowerCase() === name.toLowerCase()) t.cid = id;
    scheduleCommit(); renderModal(); toast(name + " saved as a regular");
    return;
  }
  if (kind === "addlogin") {
    const msg = $("#loginmsg"), btn = f.querySelector("button");
    if (!isAdmin()) { msg.textContent = ADMIN_ONLY; return; }
    btn.disabled = true; msg.textContent = "Creating the login…";
    addLogin(v("f-lemail"), f.elements["f-lpass"].value, f.elements["f-lrole"].value).then(() => toast("Login created. Sign in with it on the other device."), err => {
      const t = String(err && err.message || err);
      const m2 = $("#loginmsg"); if (m2) m2.textContent = /Invalid login/i.test(t) ? "That email already has a login with a different password. Use its existing password, or another email." : /another bar/i.test(t) ? "That login belongs to a different bar." : /fetch|network/i.test(t) ? "No internet connection." : t;
      const b2 = document.querySelector('form[data-f="addlogin"] button'); if (b2) b2.disabled = false;
    });
    return;
  }
  if ((kind === "item" || kind === "restock" || kind === "settings") && !isAdmin()) { toast(ADMIN_ONLY); modal(null); return; }
  if (kind === "item") {
    const p = Math.max(1, parseInt(v("f-pours"), 10) || 1), ucost = toSen(v("f-ucost"));
    const d = {name: v("f-name"), cat: tidy(v("f-catsel") === "__new" ? v("f-cat") : v("f-catsel")) || "Other", price: toSen(v("f-price")), hh: toSen(v("f-hh")), dbl: toSen(v("f-dbl")), pours: p, ucost, cost: Math.round(ucost / p),
      stock: Math.round((parseFloat(v("f-stock")) || 0) * p), low: Math.round((parseFloat(v("f-low")) || 0) * p), fav: on("f-fav"), nostock: on("f-nostock")};
    if (d.nostock) { d.stock = m.id ? (item(m.id).stock || 0) : 0; d.low = 0; }
    if (m.id) Object.assign(item(m.id), d); else S.menu.items.push({id: uid(), ...d});
    saveMenu();
  } else if (kind === "restock") {
    const it = item(m.id); it.stock = (it.stock || 0) + Math.round((parseFloat(v("f-qty")) || 0) * pours(it)); saveMenu(); toast(it.name + ": " + fmtStock(it) + " in stock");
  } else if (kind === "tabname") {
    if (m && m.rename && curTab()) { const t = curTab(), reg = findRegular(v("f-tab")); t.name = reg ? reg.name : tidy(v("f-tab")); if (reg) t.cid = reg.id; else delete t.cid; saveTabs(); } else { newTab(v("f-tab")); f.reset(); }
  } else if (kind === "close") {
    const id = dayId(), day = S.days[id] || (S.days[id] = {bills: []});
    const rp = dayRepays(id), repCash = rp.filter(r => r.pay === "cash").reduce((a, r) => a + r.amt, 0);
    const sm = summarise(day.bills), fl = toSen(v("f-float")), counted = toSen(v("f-counted")), cash = sm.pay.cash + repCash;
    day.close = {t: Date.now(), float: fl, counted, cash, later: sm.pay.later, rep: rp.reduce((a, r) => a + r.amt, 0), repCash, diff: counted - fl - cash};
    commit();
    if (submitter && submitter.dataset.print) printText(closingText(id, day.close), "closing-" + id);
    submitter = null;
    modal("closed", {day: id}); render(); afterClose(id);
    return;
  } else if (kind === "settings") {
    S.settings = {name: v("f-bar") || "My Bar", email: v("f-baremail"), svc: parseFloat(v("f-svc")) || 0, tax: parseFloat(v("f-tax")) || 0, round5: on("f-round"),
      cut: Math.max(0, Math.min(12, parseInt(v("f-cut"), 10) || 0)),
      hh: {on: on("f-hhon"), from: v("f-hhfrom") || "17:00", to: v("f-hhto") || "20:00", days: [0, 1, 2, 3, 4, 5, 6].filter(n => on("f-d" + n))}};
    saveSettings();
  }
  submitter = null;
  modal(null); render();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.modal) modal(null); });

/* ---------- start ---------- */
async function start() {
  try { const v = localStorage.getItem("bar-view"); if (["orders", "stock", "reports", "history"].includes(v)) ui.view = v; } catch (_) {}
  render();
  let lastHH = false;
  setInterval(() => { const now = hhOn(S.settings); if (now !== lastHH) { lastHH = now; if (!ui.modal) render(); } }, 30000);
  try { localStorage.setItem(KEY + "test", "1"); localStorage.removeItem(KEY + "test"); }
  catch (_) { storeOk = false; note("This browser is blocking storage, so nothing will be saved. Open the app in Chrome, not in private mode."); }
  /* Show this device's saved copy straight away, even with no internet. */
  fromDocs();
  ui.ready = true;
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  try { if (window.supabase) sb = window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: true, autoRefreshToken: true, storageKey: "bcs-auth"}}); } catch (_) { sb = null; }
  render();
  if (!sb) { if (user) note("Working offline. Changes are kept on this device and sent once the app can connect."); return; }
  if (user) {
    const {data} = await sb.auth.getSession().catch(() => ({data: {}}));
    if (data && data.session && data.session.user.id === user.id) connect();
    else if (navigator.onLine) { note("Please sign in again to keep syncing. Nothing on this device has been lost."); user = null; lsSet("user", null); render(); }
    else note("Working offline. Changes are kept on this device and sent once the app can connect.");
  }
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === "TOKEN_REFRESHED" && session) flush();
    /* Opened from a "reset your password" email: ask for the new password. */
    if (ev === "PASSWORD_RECOVERY") setTimeout(() => modal("newpass", {}), 0);
  });
  window.addEventListener("online", () => { if (user) connect(); });
  window.addEventListener("offline", () => { online = false; setSync(); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && user && sb) connect(); });
}
start();
